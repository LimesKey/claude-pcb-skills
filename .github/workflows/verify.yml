# tools/verify.sh on the oldest Python the README supports (3.12, e.g. Ubuntu 24.04 LTS) and the newest
# release (3.15); local runs cover 3.14.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Python ${{ matrix.python }})
    runs-on: ubuntu-latest           # the newest GA image (26.04 from Nov 2026)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # rsvg-convert: without it the selftest skips its PNG view cases
      - name: Install rsvg-convert and pyflakes
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends librsvg2-bin
          python -m pip install --disable-pip-version-check pyflakes
      - run: tools/verify.sh
